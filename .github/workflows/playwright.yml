name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (@critical, @smoke) o ID de un test puntual (ej: TC-003-login-exitoso-admin). Vacío = correr todos.'
        required: false
        default: ''
  schedule:
    # 8:00 AM Argentina (UTC-3, sin horario de verano) = 11:00 UTC
    - cron: '0 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          ALIZIA_ADMIN_EMAIL: ${{ secrets.ALIZIA_ADMIN_EMAIL }}
          ALIZIA_ADMIN_PASSWORD: ${{ secrets.ALIZIA_ADMIN_PASSWORD }}
          ALIZIA_TEACHER_EMAIL: ${{ secrets.ALIZIA_TEACHER_EMAIL }}
          ALIZIA_TEACHER_PASSWORD: ${{ secrets.ALIZIA_TEACHER_PASSWORD }}
          TEST_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TEST_TAG" ]; then
            npx playwright test --grep "$TEST_TAG"
          else
            npx playwright test
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
